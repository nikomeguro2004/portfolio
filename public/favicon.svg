<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="S Adityan — Full-Stack Engineer">
  <!-- Dark background matching site -->
  <rect width="64" height="64" rx="13" fill="#141210"/>

  <!-- Bold geometric "A" — orange, readable at 16px -->
  <!-- Left leg -->
  <line x1="32" y1="8" x2="7"  y2="57" stroke="#FF4F1A" stroke-width="9.5" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="32" y1="8" x2="57" y2="57" stroke="#FF4F1A" stroke-width="9.5" stroke-linecap="round"/>
  <!-- Crossbar — exact midpoint of the A legs -->
  <line x1="17"  y1="39" x2="47" y2="39" stroke="#FF4F1A" stroke-width="8" stroke-linecap="round"/>

  <!-- Accent dot — top of A, warm cream -->
  <circle cx="32" cy="8" r="2.5" fill="#F5F1E8" opacity="0.6"/>
</svg>
